<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GeoSim Traverse</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <main>
    <h1>GeoSim <span>Traverse Calculator</span></h1>
    <section class="panel">
      <h2>Start point</h2>
      <label>Northing <input id="n0" type="number" step="any" value="1000" /></label>
      <label>Easting <input id="e0" type="number" step="any" value="1000" /></label>
    </section>
    <section class="panel">
      <h2>Legs <small>(bearing as 123.5 or 123-30-09, length in meters)</small></h2>
      <table id="legs"><thead><tr><th>From</th><th>To</th><th>Bearing</th><th>Length</th><th></th></tr></thead><tbody></tbody></table>
      <button id="add">Add leg</button>
      <button id="example">Load example</button>
    </section>
    <p id="error" role="alert"></p>
    <section class="panel" id="results" hidden>
      <h2>Results</h2>
      <p id="summary"></p>
      <table id="coords"><thead><tr><th>Point</th><th>Northing</th><th>Easting</th></tr></thead><tbody></tbody></table>
      <svg id="plan" viewBox="0 0 400 400" aria-label="Traverse plan"></svg>
    </section>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
